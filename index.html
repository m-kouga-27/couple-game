<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふたりの質問ゲーム</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#fff7f8;color:#382b31;font-family:system-ui,sans-serif}main{max-width:620px;margin:auto;padding:18px 15px 35px}.hero{text-align:center;padding:12px}.hero h1{margin:4px}.card{background:white;border:1px solid #f0dce2;border-radius:18px;padding:17px;margin:12px 0}label{display:block;font-weight:bold;font-size:14px;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #e7cbd4;border-radius:12px;font:inherit}textarea{min-height:90px}button{width:100%;border:0;border-radius:12px;padding:12px;margin-top:9px;background:#e96f91;color:white;font:inherit;font-weight:bold}.secondary{background:#fff0f4;color:#9f3e5d}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.status{padding:10px;background:#fff2f5;border-radius:10px;font-size:14px;margin:10px 0}.code{text-align:center;font-size:25px;font-weight:bold;letter-spacing:2px;padding:10px;background:#fff4f6;border-radius:10px}.small{font-size:12px;color:#796a71;line-height:1.6}.question{font-size:22px;font-weight:800;line-height:1.5;margin:18px 0}.pill{background:#ffe8ef;color:#a34160;border-radius:99px;padding:5px 10px;font-size:12px}.bar{height:7px;background:#f7e3e9;border-radius:8px;margin:12px 0}.bar div{height:100%;background:#e96f91;width:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{padding:12px;border:1px solid #f0dce2;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.answer b{display:block;color:#a34160;font-size:12px;margin-bottom:5px}@media(max-width:420px){.row,.answers{grid-template-columns:1fr;display:flex;flex-direction:column}}
</style><main><div class="hero"><div style="font-size:32px">♡</div><h1>ふたりの質問ゲーム</h1><p>100の質問で、お互いのことをもっと知ろう。</p></div>
<section class="card" id="setup"><h3>① ふたりの部屋をつくる</h3><label>自分の呼び名</label><input id="myName" placeholder="例：こーが" maxlength="16"><div class="row"><button id="create">部屋をつくる</button><button class="secondary" id="showJoin">相手の部屋に入る</button></div><div id="hostBox" class="hidden"><div class="status">このコードを相手に送ってね。</div><div class="code" id="roomCode"></div><button class="secondary" id="copy">コードをコピー</button><div class="status" id="hostStatus">相手の参加を待っているよ…</div></div><div id="joinBox" class="hidden"><label>相手の部屋コード</label><input id="joinCode" placeholder="相手から聞いたコード"><button id="join">部屋に入る</button><div id="joinStatus" class="status hidden"></div></div><p class="small">二人とも同じ公開URLを開いてね。部屋を作った人はゲーム中、ページを閉じないでね。</p></section>
<section class="card hidden" id="game"><div class="row"><span class="pill" id="cat"></span><span id="count" style="text-align:right">1 / 100</span></div><div class="bar"><div id="fill"></div></div><div class="question" id="q"></div><label>自分の答え（相手にはまだ見えないよ）</label><textarea id="ans" maxlength="500" placeholder="ここに回答"></textarea><button id="submit">この答えで決定！</button><div class="status" id="state">二人が回答するまで答えは公開されないよ。</div><div id="reveal" class="hidden"><h3>ふたりの答え</h3><div class="answers"><div class="answer"><b id="nameA"></b><span id="answerA"></span></div><div class="answer"><b id="nameB"></b><span id="answerB"></span></div></div><button id="next">次の質問へ →</button></div><button class="secondary" id="leave">部屋を終了する</button></section>
<section class="card hidden" id="finish"><h2>🎉 100問クリア！</h2><p>最後までおつかれさま！</p><button id="restart">最初から遊ぶ</button></section><p class="small">通信にはPeerJSの公開サービスを使います。個人情報や見られたくない内容は入力しないでね。</p></main>
<script>
const Q={"お互いのこと": ["相手の好きな食べ物は？", "相手の好きなキャラクターは？", "相手の口ぐせは？", "相手が最近ハマっていることは？", "相手の苦手なものは？", "相手が落ち着く場所は？", "相手が得意なことは？", "疲れたときにしてほしいことは？", "相手が今ほしいものは？", "相手の好きな季節は？"], "思い出": ["初めて話したときの印象は？", "一緒にいて一番笑った思い出は？", "一番うれしかった言葉は？", "また行きたい思い出の場所は？", "好きになったきっかけは？", "一番ドキドキした瞬間は？", "二人の思い出の曲は？", "写真を見返したくなる思い出は？", "付き合ってよかったと思った瞬間は？", "記念日の思い出は？"], "好きなところ": ["相手の一番好きな性格は？", "笑顔が好きだと思う瞬間は？", "優しさを感じるのはどんなとき？", "頑張り屋だなと思うところは？", "かわいいと思うところは？", "かっこいいと思うところは？", "声や話し方で好きなところは？", "意外な一面で好きなところは？", "ありがとうと思っていることは？", "相手を一言で表すなら？"], "デート": ["理想のデートは？", "二人で食べに行きたいものは？", "一緒に行ってみたい場所は？", "おそろいにするなら何がいい？", "雨の日に二人でしたいことは？", "一日一緒にいられるなら何をする？", "遊園地で最初に行きたい場所は？", "旅行なら海・山・街のどれ？", "二人で撮りたい写真は？", "次のデートでしてみたいことは？"], "もしも": ["一週間休みになったら何をする？", "無人島に二人で行くなら何を持っていく？", "一日だけ相手と入れ替わったら何する？", "宝くじが当たったら何に使う？", "二人でお店を開くなら何のお店？", "映画の主人公ならどんな物語？", "一緒に住むなら家にほしいものは？", "二人で動物を飼うなら何がいい？", "過去の二人に一言伝えるなら？", "未来の二人に質問するなら？"], "恋愛観": ["恋人にされるとうれしいことは？", "どんなときに愛情を感じる？", "うれしい愛情表現は言葉・行動・プレゼント？", "連絡はどのくらい取るのが理想？", "ケンカしたらどう仲直りしたい？", "恋人に大切にしてほしいことは？", "不安なときにしてほしいことは？", "二人の時間と一人の時間の理想のバランスは？", "記念日は盛大派？ささやか派？", "長く付き合うために大事なことは？"], "日常": ["朝デートと夜デート、どっちが好き？", "一緒に食べるなら朝・昼・夜ごはん？", "電話とメッセージ、どっちが好き？", "一緒に勉強するなら静かに？教え合う？", "一緒に見るなら映画・アニメ・動画？", "二人で散歩するならどこ？", "コンビニで相手に買ってあげたいものは？", "疲れた日に一緒にしたいことは？", "一緒に作ってみたい料理は？", "二人の定番にしたい習慣は？"], "将来": ["いつか二人で行ってみたい場所は？", "将来一緒に挑戦したいことは？", "何年後の二人を想像する？", "二人で大切にしたい約束は？", "一緒に覚えたい趣味は？", "将来住むなら都会・田舎・自然の近く？", "二人で貯金するなら何のため？", "年を重ねても一緒にしたいことは？", "未来の記念日にしてみたいことは？", "これから二人で増やしたい思い出は？"], "二択": ["手をつなぐ or 腕を組む？", "電話する or 会って話す？", "サプライズ or 一緒に計画？", "家デート or お出かけデート？", "海デート or 夜景デート？", "毎日少し連絡 or 週末に長電話？", "写真をたくさん撮る or 目に焼きつける？", "おそろい or 色違いの小物？", "甘えたい or 甘えられたい？", "計画派 or その場で決める派？"], "ちょっと深い話": ["もっと知ってほしい自分の一面は？", "落ち込んだとき、どう接してほしい？", "言われるとうれしい言葉は？", "二人で改善していきたいことは？", "相手にまだ聞けていないことは？", "自分が大切にしている価値観は？", "安心できる関係ってどんな関係？", "意見が違うときに大事にしたいことは？", "最近、相手に感謝したいことは？", "これから相手に伝えていきたい気持ちは？"]};const all=Object.entries(Q).flatMap(([category,items])=>items.map(text=>({category,text})));const $=x=>document.getElementById(x);let peer,conn,role,name="あなた",other="相手",room="",i=0,mine="",theirs="",sent=false,otherSent=false,connected=false;
function show(id,on=true){$(id).classList.toggle("hidden",!on)}function msg(id,t){$(id).textContent=t}function send(o){if(conn&&conn.open)conn.send(o)}
function peerStart(id){return new Promise((ok,no)=>{peer=new Peer(id);peer.on("open",ok);peer.on("error",no)})}
function attach(c){conn=c;c.on("open",()=>{connected=true;show("setup",false);show("game");send({type:"hello",name});render()});c.on("data",m=>{if(m.type==="hello"){other=m.name||"相手";render()}if(m.type==="answer"){theirs=m.answer;otherSent=true;render()}if(m.type==="advance"){i=m.i;mine="";theirs="";sent=otherSent=false;render()}if(m.type==="reset"){i=0;mine="";theirs="";sent=otherSent=false;render()}});c.on("close",()=>msg("state","相手との接続が切れたよ。相手がページを開いているか確認してね。"))}
function render(){if(i>=all.length){show("game",false);show("finish");return}let q=all[i];msg("cat",q.category);msg("count",(i+1)+" / 100");$("fill").style.width=((i+1)/100*100)+"%";msg("q",q.text);$("ans").value=mine;$("ans").disabled=sent;$("submit").disabled=sent;$("submit").textContent=sent?"回答済み ✓":"この答えで決定！";msg("nameA",name);msg("nameB",other);show("reveal",sent&&otherSent);if(sent&&otherSent){msg("answerA",mine);msg("answerB",theirs);msg("state","二人とも回答したので公開！")}else if(sent)msg("state","回答を送信したよ。相手の回答を待っているよ…（まだ非公開）");else msg("state","二人が回答するまで、お互いの答えは公開されないよ。")}
$("create").onclick=async()=>{name=$("myName").value.trim()||"あなた";role="host";room="love"+Math.random().toString(36).slice(2,7);$("create").disabled=true;msg("hostStatus","部屋を準備中…");try{await peerStart(room);msg("roomCode",room);show("hostBox");peer.on("connection",c=>{if(conn)c.close();else attach(c)})}catch(e){msg("hostStatus","部屋を作れなかったよ。再読み込みして試してね。");$("create").disabled=false}};
$("showJoin").onclick=()=>show("joinBox");
$("join").onclick=async()=>{name=$("myName").value.trim()||"あなた";room=$("joinCode").value.trim().toLowerCase();if(!room){show("joinStatus");msg("joinStatus","コードを入力してね。");return}show("joinStatus");msg("joinStatus","接続中…");$("join").disabled=true;try{await peerStart();attach(peer.connect(room,{reliable:true}));setTimeout(()=>{if(!connected){msg("joinStatus","つながらないよ。コードと相手の接続を確認してね。");$("join").disabled=false}},8000)}catch(e){msg("joinStatus","接続できなかったよ。通信環境を確認してね。");$("join").disabled=false}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(room);msg("hostStatus","コピーしたよ！相手に送ってね。")}catch(e){msg("hostStatus","コードを長押ししてコピーしてね。")}};
$("submit").onclick=()=>{mine=$("ans").value.trim();if(!mine){msg("state","答えを書いてから決定してね。");return}sent=true;send({type:"answer",answer:mine});render()};
$("next").onclick=()=>{if(!sent||!otherSent)return;if(role!=="host"){msg("state","部屋を作った人が次の質問へ進むよ。");return}i++;mine=theirs="";sent=otherSent=false;send({type:"advance",i});render()};
$("leave").onclick=()=>{if(peer)peer.destroy();location.reload()};
$("restart").onclick=()=>{i=0;mine=theirs="";sent=otherSent=false;if(role==="host")send({type:"reset"});show("finish",false);show("game");render()};
</script></html>
